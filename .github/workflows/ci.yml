---
name: ci

on:
  push:
    branches-ignore:
      - "release-plz-*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    #TODO? replace by a charts only ci like https://github.com/helm/chart-testing-action
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        folder:
          - cdviz-db
          - cdviz-grafana
          - charts
          - demos
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - uses: docker/setup-buildx-action@v3
      - name: check changed files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47.0.0
        id: changed-files
        with:
          files: |
            ${{ matrix.folder }}/**
      - name: log
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "::notice ::no changed files on ${{ matrix.folder }} - skipping"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.changed-files.outputs.any_changed == 'true'
        with:
          install: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: helm/kind-action@v1.14.0
        if: (steps.changed-files.outputs.any_changed == 'true' && matrix.folder != 'cdviz-grafana')
      # - run: mise install
      #   if: steps.changed-files.outputs.any_changed == 'true'
      #   shell: bash
      #   working-directory: ${{ matrix.folder }}
      - run: |
          mise run '//${{ matrix.folder }}:ci'
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: bash

  site:
    # same build as pages.yml (deploy only on main), so deps updates are checked before merge
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: check changed files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47.0.0
        id: changed-files
        with:
          files: |
            cdviz-site/**
      - name: log
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "::notice ::no changed files on cdviz-site - skipping"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.changed-files.outputs.any_changed == 'true'
        with:
          install: false
          working_directory: ./cdviz-site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          mise run :install
          mise run :build:site
        if: steps.changed-files.outputs.any_changed == 'true'
        working-directory: ./cdviz-site
        shell: bash
        env:
          NODE_ENV: "production"
