name: plumber

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plumber:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Plumber reads the workflow states and one run log to prove the
      # token scope, without it that assessment stays unknown.
      actions: read
      security-events: write
      # Needed by score-push to publish the score for the README badge.
      id-token: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: getplumber/plumber@v0.7.23
        with:
          # Code scanning upload needs security-events write, which pull
          # requests from forks do not get. The report stays available
          # as a workflow artifact there.
          upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}
          # Publishes the score to score.getplumber.io, which feeds the
          # badge in the README. A failed push never fails the run.
          score-push: true
          # Gate at 85 points instead of the all-or-nothing default, so
          # one small finding does not block a pull request.
          min-points: 85
